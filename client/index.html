<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- 简书等图床有 Referer 盗链校验：预览外链图片必须无来源请求，否则 403 -->
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" type="image/png" href="/logo.png?v=2" />
		<title>Shirone Admin</title>
		<script>
			// 与 composables/useTheme.ts 同规则：挂载前定好明暗，避免首屏闪错主题
			(() => {
				try {
					const saved = localStorage.getItem("shirone-admin-theme");
					if (
						saved === "dark" ||
						(saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
					) {
						document.documentElement.classList.add("dark");
					}
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
